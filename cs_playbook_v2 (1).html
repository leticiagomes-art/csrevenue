function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function rgba(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}

function h(tag,attrs,inner){
  var a=Object.keys(attrs).map(function(k){return k+'="'+attrs[k]+'"';}).join(" ");
  return "<"+tag+(a?" "+a:"")+">"+inner+"</"+tag+">";
}
function btn(cls,onclick,style,inner){
  return '<button class="'+cls+'" onclick="'+onclick+'" style="'+style+'">'+inner+'</button>';

  document.getElementById("stat-prod").textContent=tot;

  document.getElementById("stat-dev").textContent=tot-rdy;
  document.getElementById("sb-nichos").innerHTML=N.map(function(n){

  }).join("")+'</div>';

  var body="";
  if(cT==="ip"){
    var ip=n.sc.ip;
    body='<div class="info-card">'
      +'<div class="info-hd">'
      +'<div class="info-format-tag" style="background:'+rgba(n.acc,.15)+';color:'+n.txt+'">'+esc(ip.tipo)+'</div>'
      +'<div class="info-title">'+esc(ip.titulo)+'</div>'
      +'<div class="info-desc">'+esc(ip.desc)+'</div>'
      +'</div>'
      +'<div class="info-body">'
      +'<div class="info-meta">'
      +'<div class="im-item"><div class="im-lbl">Preço sugerido</div><div class="im-val">'+esc(ip.preco)+'</div></div>'
      +'<div class="im-item"><div class="im-lbl">Formato</div><div class="im-val">'+esc(ip.tipo)+'</div></div>'
      +'<div class="im-item"><div class="im-lbl">Estratégia de uso</div><div class="im-val">'+esc(ip.upsell)+'</div></div>'
      +'</div>'
      +'<div class="info-content">'
      +'<div class="info-content-title">Conteúdo sugerido</div>'
      +'<div class="info-content-list">'+esc(ip.conteudo)+'</div>'
      +'</div>'
      +'<div class="slbl">Script de pitch do infoproduto</div>'
      +sCard(ip.pitch,0,"ip")
      +'</div></div>';
  } else {
    var sc=n.sc[cT];
    var csCards=n.cs.map(function(c){
      var t=N.find(function(x){return x.id===c.nid;});
      var tb=t?t.bg:"#f1f5f9";
      var tt=t?t.txt:"#334155";
      var onclick=t?"gN('"+c.nid+"')":"";
      var style=t?"":"cursor:default";
      return '<div class="cs-card" onclick="'+onclick+'" style="'+style+'">'
        +'<div class="cs-name">'+esc(c.n)+'</div>'
        +'<span class="cs-nbadge" style="background:'+tb+';color:'+tt+'">'+c.nid.toUpperCase()+'</span>'
        +'<div class="cs-why">'+esc(c.w)+'</div>'
        +'</div>';
    }).join("");
    body='<div class="scenario-box">'
      +'<div class="sc-title">Contexto do atendimento</div>'
      +'<div class="sc-ctx">'+esc(sc.ctx)+'</div>'
      +'<div class="sc-approach" style="background:'+rgba(n.acc,.1)+';color:'+n.txt+'">→ Abordagem: '+esc(sc.ap)+'</div>'
      +'</div>'
      +'<div class="slbl">Scripts prontos para copiar</div>'
      +sc.msgs.map(function(m,i){return sCard(m,i,cT);}).join("")
      +'<div class="slbl">Cross-sells recomendados para este nicho</div>'
      +'<div class="cs-grid">'+csCards+'</div>';
  }

  var metaS=rdy!==1?"s":"";
  var header='<div class="nh">'
    +'<div class="nh-icon" style="background:'+rgba(n.acc,.15)+'">'+n.icon+'</div>'
    +'<div>'
    +'<div><span class="nh-name">'+n.label+'</span>'
    +'<span class="nh-badge" style="background:'+rgba(n.acc,.15)+';color:'+n.txt+'">'+n.abbr+'</span></div>'
    +'<div class="nh-meta">'+rdy+' produto'+metaS+' ativo'+metaS+' &bull; '+(n.prods.length-rdy)+' em desenvolvimento</div>'
    +'</div></div>';

  document.getElementById("content").innerHTML=header+prods+rPR()+tabs+body;
}

window.gN=function(id){cN=id;cT="fr";rSB();rM();}
window.gT=function(id){cT=id;rM();}
window.cpS=function(key){
  var t=_scripts[key]||"";
  try{navigator.clipboard.writeText(t);}catch(e){}
  cpK=key;rM();setTimeout(function(){cpK=null;rM();},2200);
}
rSB();rM();
</script>
</body>
</html>
