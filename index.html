<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CS Revenue Playbook — Nutraceutical USA (Email / Freshdesk)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME SYSTEM — variáveis semânticas
   Default (:root) = WHITE theme | [data-theme="dark"] = DARK theme
   Cores de nicho/estratégia (acentos) permanecem inline no JS,
   pois são cores de dados e funcionam nos dois temas.
   ============================================================ */
:root{
  /* sidebar */
  --sb-bg:#ffffff; --sb-border:#e2e8f0; --sb-title:#0f172a; --sb-sub:#94a3b8;
  --sb-lbl:#94a3b8; --sb-stat-bg:#f1f5f9; --sb-stat-n:#0f172a; --sb-stat-l:#94a3b8;
  --nb-name:#475569; --nb-name-active:#0f172a; --nb-hover:#f1f5f9; --nb-active:#f1f5f9;
  --nb-prog:#94a3b8; --nb-icon-idle:rgba(14,116,144,.12);
  /* main */
  --main-bg:#f0f4f8; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#fcfdfe;
  --border:#e2e8f0; --border-soft:#f1f5f9;
  --text:#0f172a; --text-2:#475569; --text-3:#64748b; --text-4:#94a3b8;
  --shadow:rgba(0,0,0,.06); --shadow-soft:rgba(0,0,0,.04);
  --hero-from:#0f172a; --hero-to:#1e293b; --hero-text:#cbd5e1;
  --code-bg:#f1f5f9; --scroll-thumb:#cbd5e1;
  --accent:#0e7490; --accent-soft:#cffafe;
  /* badges / callouts mantêm cor própria */
}
[data-theme="dark"]{
  --sb-bg:#060b14; --sb-border:#0f172a; --sb-title:#f8fafc; --sb-sub:#334155;
  --sb-lbl:#1e3a5f; --sb-stat-bg:#0f172a; --sb-stat-n:#f8fafc; --sb-stat-l:#475569;
  --nb-name:#64748b; --nb-name-active:#f1f5f9; --nb-hover:#0f172a; --nb-active:#0f172a;
  --nb-prog:#1e3a5f; --nb-icon-idle:rgba(14,116,144,.15);
  --main-bg:#0a1120; --surface:#0f172a; --surface-2:#111c30; --surface-3:#0d1626;
  --border:#1e293b; --border-soft:#16223a;
  --text:#f1f5f9; --text-2:#cbd5e1; --text-3:#94a3b8; --text-4:#64748b;
  --shadow:rgba(0,0,0,.4); --shadow-soft:rgba(0,0,0,.3);
  --hero-from:#0e7490; --hero-to:#155e75; --hero-text:#cbd5e1;
  --code-bg:#1e293b; --scroll-thumb:#334155;
  --accent:#22d3ee; --accent-soft:#164e63;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;display:flex;height:100vh;overflow:hidden;background:var(--sb-bg);color:var(--text);transition:background .25s,color .25s;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}
#sb{width:280px;background:var(--sb-bg);border-right:1px solid var(--sb-border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;transition:background .25s,border-color .25s}
.sb-hd{padding:18px 16px 14px;border-bottom:1px solid var(--sb-border)}
.sb-title{font-size:15.5px;font-weight:800;color:var(--sb-title);letter-spacing:-.02em}
.sb-sub{font-size:12.5px;color:var(--sb-sub);margin-top:2px;line-height:1.5}
.sb-stats{display:flex;gap:7px;margin-top:11px}
.sb-stat{background:var(--sb-stat-bg);border-radius:7px;padding:7px 8px;flex:1;text-align:center}
.sb-stat-n{font-size:18px;font-weight:900;color:var(--sb-stat-n)}
.sb-stat-l{font-size:11px;color:var(--sb-stat-l);margin-top:1px}
.sb-lbl{font-size:11.5px;font-weight:700;color:var(--sb-lbl);letter-spacing:.1em;text-transform:uppercase;padding:13px 16px 5px}
/* toggle de tema */
.theme-toggle{display:flex;gap:4px;margin:10px 12px 4px;background:var(--sb-stat-bg);border-radius:9px;padding:3px}
.tt-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--nb-name);padding:6px 4px;border-radius:7px;font-family:inherit;transition:all .15s}
.tt-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px var(--shadow)}
.tt-btn:hover:not(.on){color:var(--nb-name-active)}
.nb{display:flex;align-items:center;gap:9px;width:100%;padding:7px 12px 7px 14px;border:none;background:transparent;cursor:pointer;text-align:left;border-left:2px solid transparent;transition:all .12s}
.nb:hover{background:var(--nb-hover)}.nb.active{background:var(--nb-active)}
.nb-icon{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16.5px;flex-shrink:0}
.nb-info{flex:1;min-width:0}
.nb-name{font-size:13.5px;color:var(--nb-name);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.nb.active .nb-name{color:var(--nb-name-active);font-weight:600}
.nb-prog{font-size:11.5px;color:var(--nb-prog);margin-top:1px}
.tag-badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;margin-top:2px}
#main{flex:1;overflow-y:auto;background:var(--main-bg);transition:background .25s}
.mi{padding:24px 28px 60px;max-width:980px}
/* ── MODO FLUXO FULLSCREEN + SPLIT ── */
body.mode-fluxo #main{overflow:hidden;display:flex;flex-direction:column}
body.mode-fluxo .mi{padding:14px 16px 0;max-width:none;display:flex;flex-direction:column;height:100%;overflow:hidden;gap:0}
body.mode-fluxo .nh{flex-shrink:0;margin-bottom:10px}
/* Split container: SVGs à esquerda, sidebar à direita */
.fluxo-split{display:flex;flex:1;min-height:0;gap:10px;overflow:hidden}
.fluxo-svgs{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 2px}
.fluxo-canvas{background:var(--surface);border-radius:10px;overflow:auto;box-shadow:0 1px 4px var(--shadow);cursor:grab;flex-shrink:0}
.fluxo-canvas:active{cursor:grabbing}
.fluxo-canvas svg{display:block}
.fluxo-canvas svg text{font-family:'Nunito',sans-serif!important}
/* Sidebar interna de scripts */
.fi-sidebar{width:340px;flex-shrink:0;background:var(--surface);border-radius:10px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.fi-sb-hd{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface-2)}
.fi-sb-title{font-size:12px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.06em}
.fi-sb-agent{font-size:11px;color:var(--text-3);margin-top:2px}
.fi-sb-body{flex:1;overflow-y:auto;padding:0}
/* Seções colapsáveis */
.fi-section{border-bottom:1px solid var(--border-soft)}
.fi-sec-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;background:var(--surface);transition:background .12s;user-select:none}
.fi-sec-hd:hover{background:var(--surface-2)}
.fi-sec-icon{font-size:14px;flex-shrink:0}
.fi-sec-label{font-size:12px;font-weight:700;color:var(--text);flex:1}
.fi-sec-count{font-size:10px;color:var(--text-4);background:var(--surface-2);padding:1px 7px;border-radius:8px}
.fi-sec-arrow{font-size:10px;color:var(--text-4);transition:transform .15s}
.fi-sec-arrow.open{transform:rotate(180deg)}
.fi-sec-body{display:none;padding:6px 8px}
.fi-sec-body.open{display:block}
/* Script cards na sidebar */
.fi-script-card{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s;border:1px solid transparent;margin-bottom:3px}
.fi-script-card:hover{background:var(--surface-2);border-color:var(--border)}
.fi-script-card.open{background:var(--accent-soft);border-color:var(--accent)}
.fi-sc-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.fi-sc-info{flex:1;min-width:0}
.fi-sc-step{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-4)}
.fi-sc-title{font-size:11.5px;font-weight:600;color:var(--text);line-height:1.3;margin-top:1px}
/* Script expandido inline */
.fi-script-expanded{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:0 8px 6px;border-left:3px solid var(--accent)}
.fi-se-subj{font-size:10.5px;font-weight:700;color:var(--accent);margin-bottom:6px}
.fi-se-why{font-size:11px;color:var(--text-2);line-height:1.6;margin-bottom:8px;background:var(--surface);border-radius:6px;padding:7px 9px}
.fi-se-script{font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.7;max-height:220px;overflow-y:auto}
.fi-se-copy{display:flex;align-items:center;gap:5px;margin-top:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;color:var(--text-3);font-family:inherit;transition:all .12s;width:100%}
.fi-se-copy:hover{border-color:var(--accent);color:var(--accent)}
.fi-se-copy.ok{border-color:#10b981;color:#10b981;background:var(--accent-soft)}
/* Motivo mini-card na sidebar */
.fi-motivo{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:3px;border:1px solid transparent}
.fi-motivo:hover{background:var(--surface-2);border-color:var(--border)}
.fi-mot-emoji{font-size:16px;flex-shrink:0;width:24px;text-align:center}
.fi-mot-info{flex:1;min-width:0}
.fi-mot-name{font-size:11.5px;font-weight:600;color:var(--text);line-height:1.3}
.fi-mot-cat{font-size:9.5px;padding:1px 6px;border-radius:6px;display:inline-block;margin-top:2px;font-weight:600}
.fi-mot-pct{font-size:9.5px;color:var(--text-4);margin-left:4px}
/* Cross-sell card */
.fi-cs-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:3px;background:var(--surface-2);border:1px solid var(--border-soft)}
.fi-cs-name{font-size:12px;font-weight:600;color:var(--text)}
.fi-cs-why{font-size:10.5px;color:var(--text-3);margin-top:1px}
.nh{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--surface);border-radius:14px;margin-bottom:14px;box-shadow:0 1px 4px var(--shadow)}
.nh-icon{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.nh-name{font-size:23px;font-weight:800;color:var(--text);letter-spacing:-.03em}
.nh-badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:12px;margin-left:7px;vertical-align:middle;letter-spacing:.04em}
.nh-meta{font-size:13.5px;color:var(--text-3);margin-top:3px}
.prod-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}
.pb{font-size:13px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pb.r{color:white}.pb.w{background:var(--surface-2);color:var(--text-4);border:1px solid var(--border)}
.pricing{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px}
.pc.ft{background:#0f172a;border-color:#0f172a}
.pc-lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4)}
.pc.ft .pc-lbl{color:#cbd5e1}
.best-tag{display:inline-block;font-size:11px;font-weight:800;background:#10b981;color:white;padding:1px 6px;border-radius:8px;margin-left:4px;vertical-align:1px}
.pc-price{font-size:27px;font-weight:900;color:var(--text);letter-spacing:-.04em;margin-top:3px}
.pc.ft .pc-price{color:white}
.pc-unit{font-size:12.5px;font-weight:400;color:#94a3b8}
.pc-info{font-size:12.5px;color:var(--text-4);margin-top:3px}
.pc.ft .pc-info{color:#94a3b8}
.pc-save{font-size:12.5px;font-weight:700;color:#10b981;margin-top:2px}
.pc-ship{font-size:12.5px;font-weight:600;color:#10b981;margin-top:1px}
.tab-nav{display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:12px;margin-bottom:14px;box-shadow:0 1px 3px var(--shadow-soft);flex-wrap:wrap}
.tb{flex:1;padding:8px 6px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-3);border-radius:9px;transition:all .12s;white-space:nowrap;min-width:90px}
.tb:hover{background:var(--surface-2);color:var(--text)}.tb.active{font-weight:700;color:white}
.scenario-box{background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow-soft)}
.sc-title{font-size:13.5px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.sc-ctx{font-size:14.5px;color:var(--text-3);line-height:1.65;margin-bottom:8px}
.sc-approach{font-size:14px;font-weight:600;padding:7px 11px;border-radius:8px;line-height:1.5}
.sk{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:9px}
.sk-hd{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:var(--surface-2);border-bottom:1px solid var(--border);gap:8px}
.sk-num{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0;color:white}
.sk-lbl{font-size:13.5px;font-weight:600;color:var(--text-2);margin-left:8px;flex:1}
.cp-btn{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);font-size:13px;cursor:pointer;transition:all .12s;font-family:inherit;white-space:nowrap;flex-shrink:0}
.cp-btn:hover{border-color:var(--text-4);color:var(--text)}.cp-btn.ok{border-color:#10b981;background:#ecfdf5;color:#059669}
[data-theme="dark"] .cp-btn.ok{background:#064e3b;color:#6ee7b7;border-color:#059669}
.sk-body{padding:0}
.email-subject{font-size:14px;font-weight:700;color:var(--text);padding:10px 14px 4px;background:var(--surface-3)}
.script-en{padding:11px 14px 13px;font-size:15px;line-height:1.85;color:var(--text-2);white-space:pre-wrap;border-bottom:1px solid var(--border-soft)}
.script-why{padding:10px 14px;font-size:14px;line-height:1.7;color:var(--text-2);background:var(--surface-2);white-space:pre-wrap}
.script-why b{color:var(--text);font-weight:700}
.why-tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:7px;margin-bottom:6px}
.cs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cs-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:pointer;transition:all .15s}
.cs-card:hover{border-color:var(--text-4);transform:translateY(-1px);box-shadow:0 2px 8px var(--shadow)}
.cs-name{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.cs-nbadge{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:8px;display:inline-block;margin-bottom:5px}
.cs-why{font-size:13.5px;color:var(--text-3);line-height:1.4}
.info-card{background:var(--surface);border-radius:12px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 4px var(--shadow)}
.info-hd{padding:16px 18px;border-bottom:1px solid var(--border-soft)}
.info-format-tag{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:10px;display:inline-block;margin-bottom:8px}
.info-title{font-size:20px;font-weight:900;color:var(--text);letter-spacing:-.03em;margin-bottom:5px}
.info-desc{font-size:14.5px;color:var(--text-3);line-height:1.65}
.info-body{padding:14px 18px}
.info-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px}
.im-item{background:var(--surface-2);border-radius:8px;padding:10px 12px;border:1px solid var(--border-soft)}
.im-lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--text-4);margin-bottom:3px;letter-spacing:.05em}
.im-val{font-size:14.5px;font-weight:700;color:var(--text)}
.info-content{background:var(--surface-2);border-radius:9px;padding:13px 14px;margin-bottom:14px;border:1px solid var(--border-soft)}
.info-content-title{font-size:12.5px;font-weight:800;text-transform:uppercase;color:var(--text-3);letter-spacing:.07em;margin-bottom:8px}
.info-content-list{font-size:14.5px;color:var(--text-2);line-height:2;white-space:pre-wrap}
.slbl{font-size:12.5px;font-weight:800;color:var(--text-4);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px}
.metric-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.metric-card{background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px var(--shadow-soft)}
.metric-lbl{font-size:13.5px;color:var(--text-3);margin-bottom:7px}
.dots{display:flex;gap:3px}
.dot{width:18px;height:5px;border-radius:3px}
.callout{border-radius:12px;padding:13px 15px;margin:14px 0;font-size:15px;line-height:1.7}
.callout-tip{background:#eef2ff;color:#3730a3}
.callout-warn{background:#fef2f2;color:#991b1b}
.callout-fresh{background:#ecfdf5;color:#065f46}
[data-theme="dark"] .callout-tip{background:#1e1b4b;color:#c7d2fe}
[data-theme="dark"] .callout-warn{background:#450a0a;color:#fecaca}
[data-theme="dark"] .callout-fresh{background:#064e3b;color:#a7f3d0}
.callout b{font-weight:800}
.fresh-step{display:flex;gap:12px;background:var(--surface);border-radius:11px;padding:13px 15px;margin-bottom:9px;box-shadow:0 1px 3px var(--shadow-soft)}
.fresh-num{width:26px;height:26px;border-radius:8px;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:800;flex-shrink:0}
[data-theme="dark"] .fresh-num{color:#06141f}
.fresh-body{flex:1}
.fresh-h{font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:4px}
.fresh-p{font-size:14.5px;color:var(--text-2);line-height:1.65}
.fresh-p code{background:var(--code-bg);padding:1px 6px;border-radius:5px;font-size:13.5px;color:var(--accent);font-family:ui-monospace,monospace}
.intro-hero{background:linear-gradient(135deg,var(--hero-from),var(--hero-to));border-radius:16px;padding:24px 26px;margin-bottom:16px;color:white}
.intro-hero h1{font-size:27px;font-weight:900;letter-spacing:-.03em;margin-bottom:8px}
.intro-hero p{font-size:15.5px;line-height:1.7;color:var(--hero-text);margin-bottom:6px}
.pill-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pill{font-size:13px;font-weight:600;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid rgba(255,255,255,.12)}
.principle{background:var(--surface);border-radius:12px;padding:15px 17px;margin-bottom:10px;box-shadow:0 1px 3px var(--shadow-soft);border-left:3px solid var(--accent)}
.principle-h{font-size:16px;font-weight:800;color:var(--text);margin-bottom:5px}
.principle-p{font-size:15px;color:var(--text-2);line-height:1.7}
.principle-p b{color:var(--text)}
pre{font-family:inherit}
.seq-tag{display:inline-block;font-size:11.5px;font-weight:700;color:#7c3aed;background:#ede9fe;padding:2px 8px;border-radius:8px;margin-left:6px}
[data-theme="dark"] .seq-tag{color:#c4b5fd;background:#2e1065}
/* ===== TABELA DE MOTIVOS DE CONTATO (Freshdesk) ===== */
.rtbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 4px var(--shadow)}
.rtbl th{background:var(--surface-2);text-align:left;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:10px 13px;border-bottom:1px solid var(--border)}

function applyAgentToScript(script, agentObj){
  if(!agentObj) return script;
  const cs = agentObj.cs || [];
  return script
    .replace(/\[AGENT\]/g, agentObj.agent)
    .replace(/\[PRODUCT\]/g, agentObj.product)
    .replace(/\[CROSSSELL_1\]/g, cs[0]||'[produto complementar]')
    .replace(/\[CROSSSELL_2\]/g, cs[1]||'[produto complementar]')
    .replace(/\[CROSSSELLS\]/g, cs.join(', ')||'ver nichos relacionados');
}

.fn-arrow{font-size:11px;color:var(--text-4);transition:transform .2s;flex-shrink:0}
.fn-arrow.open{transform:rotate(180deg)}
/* Filhos */
.fn-children{display:none;padding:0 0 0 32px;border-left:2px solid var(--fn-accent,#0ea5e9);margin-left:15px}
.fn-children.open{display:block}
/* Decisão (losango) */
.fn-decision{background:var(--surface-2);border:2px solid var(--fn-accent,#0ea5e9);border-radius:50%;padding:8px 14px;margin:6px 0 6px 15px;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s}
.fn-decision:hover{background:var(--surface-3)}
.fn-decision.open{background:var(--accent-soft)}
/* Label SIM/NÃO */
.fn-branch-label{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;display:inline-block;margin:4px 0 4px 15px}
/* Script inline */
.fn-script{background:var(--surface-2);border-radius:9px;padding:12px 14px;margin:6px 0 6px 0;border-left:3px solid var(--fn-accent,#0ea5e9);display:none}
.fn-script.open{display:block}
.fn-script-why{font-size:11.5px;color:var(--text-2);line-height:1.7;background:var(--surface);border-radius:7px;padding:8px 10px;margin-bottom:10px}
.fn-script-subj{font-size:11.5px;font-weight:700;color:var(--fn-accent,#0ea5e9);margin-bottom:6px}
.fn-script-body{font-size:12px;color:var(--text);white-space:pre-wrap;line-height:1.8;max-height:260px;overflow-y:auto;background:var(--surface);border-radius:7px;padding:10px 12px}
.fn-copy{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;padding:7px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-3);font-family:inherit;transition:all .12s;width:100%}
.fn-copy:hover{border-color:var(--fn-accent,#0ea5e9);color:var(--fn-accent,#0ea5e9)}
.fn-copy.ok{background:var(--accent-soft);border-color:#10b981;color:#10b981}
/* Produto-variante dentro de retenção */
.fn-product-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:8px;margin-bottom:4px}
/* Start/End nodes */
.fn-start{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);border-radius:30px;padding:10px 22px;text-align:center;margin:0 auto 16px;display:inline-block;font-size:13.5px;font-weight:800;color:white;letter-spacing:-.01em}
.fn-end{background:var(--surface-2);border:2px solid var(--border);border-radius:30px;padding:8px 20px;text-align:center;margin:12px auto 0;display:inline-block;font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:-.01em}
/* Seção de rota */
.fn-route-header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;margin:8px 0 4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
`;

  // ── Renderizador recursivo ──
  let _scriptStore = {};
  function renderNode(node, depth) {
    const el = document.createElement('div');
    el.className = 'fn';
    el.style.setProperty('--fn-accent', node.color || '#0ea5e9');

    if (node.type === 'start') {
      const start = document.createElement('div');
      start.style.cssText = 'text-align:center;margin-bottom:16px';
      start.innerHTML = `<div class="fn-start">${node.label}</div>`;
      el.appendChild(start);
      (node.children || []).forEach(child => el.appendChild(renderNode(child, depth + 1)));
      return el;
    }

    if (node.type === 'decision') {
      const dec = document.createElement('div');
      dec.className = 'fn-decision';
      dec.innerHTML = `<span>◆</span><span>${node.label}</span><span class="fn-arrow">▼</span>`;
      const childWrap = document.createElement('div');
      childWrap.className = 'fn-children';
      (node.children || []).forEach(child => {
        if (child.branchLabel) {
          const bl = document.createElement('div');
          bl.className = 'fn-branch-label';
          bl.style.cssText = `background:${child.branchColor}22;color:${child.branchColor};border:1px solid ${child.branchColor}44`;
          bl.textContent = child.branchLabel;
          childWrap.appendChild(bl);
        }
        childWrap.appendChild(renderNode(child, depth + 1));
      });
      dec.addEventListener('click', () => {
        dec.classList.toggle('open');
        const arr = dec.querySelector('.fn-arrow');
        if (arr) arr.classList.toggle('open');
        childWrap.classList.toggle('open');
      });
      el.appendChild(dec);
      el.appendChild(childWrap);
      return el;
    }

    // Nó padrão
    const hasChildren = node.children && node.children.length > 0;
    const hasScript = node.script && node.script.body;

    const card = document.createElement('div');
    card.className = 'fn-card' + (node.leaf && !hasChildren ? ' leaf' : '');
    card.style.setProperty('--fn-accent', node.color || '#0ea5e9');

    // Badge
    const badgeHtml = node.badge
      ? `<span class="fn-badge" style="background:${node.badgeBg||'#e2e8f0'};color:${node.badgeTx||'#374151'}">${node.badge}</span>` : '';

    card.innerHTML = `<div class="fn-hd">
      <div class="fn-icon" style="background:${node.color}22;border:1px solid ${node.color}44">${node.icon || '▸'}</div>
      <div class="fn-label">
        <div class="fn-title">${node.label}${badgeHtml}</div>
        ${node.sub ? `<div class="fn-sub">${node.sub}</div>` : ''}
      </div>
      ${(hasChildren || hasScript) ? '<div class="fn-arrow">▼</div>' : ''}
    </div>`;

    const bodyWrap = document.createElement('div');
    bodyWrap.style.cssText = 'padding:0 13px';

    // Script inline
    if (hasScript) {
      const sid = node.script.key || ('s' + Math.random().toString(36).slice(2, 7));
      _scriptStore[sid] = node.script.body;
      const scriptDiv = document.createElement('div');
      scriptDiv.className = 'fn-script';
      scriptDiv.innerHTML = `
        ${node.script.why ? `<div class="fn-script-why">${node.script.why}</div>` : ''}
        ${node.script.subj ? `<div class="fn-script-subj">📩 ${node.script.subj}</div>` : '<div style="font-size:10.5px;color:var(--text-4);margin-bottom:6px">📋 Script interno</div>'}
        <div class="fn-script-body">${(node.script.body||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
        <button class="fn-copy" id="fn-copy-${sid}" onclick="copyFnScript('${sid}')">⎘ Copiar script</button>`;
      bodyWrap.appendChild(scriptDiv);
    }

    // Filhos
    const childWrap = document.createElement('div');
    childWrap.className = 'fn-children';
    childWrap.style.setProperty('--fn-accent', node.color || '#0ea5e9');
    (node.children || []).forEach(child => {
      if (child.branchLabel) {
        const bl = document.createElement('div');
        bl.className = 'fn-branch-label';
        bl.style.cssText = `background:${child.branchColor}22;color:${child.branchColor};border:1px solid ${child.branchColor}44`;
        bl.textContent = child.branchLabel;
        childWrap.appendChild(bl);
      }
      childWrap.appendChild(renderNode(child, depth + 1));
    });
    bodyWrap.appendChild(childWrap);
    card.appendChild(bodyWrap);

    // Click toggle
    if (hasChildren || hasScript) {
      const hd = card.querySelector('.fn-hd');
      hd.addEventListener('click', () => {
        card.classList.toggle('open');
        const arr = card.querySelector('.fn-arrow');
        if (arr) arr.classList.toggle('open');
        const script = card.querySelector('.fn-script');
        if (script) script.classList.toggle('open');
        if (hasChildren) childWrap.classList.toggle('open');
      });
    }

    el.appendChild(card);
    return el;
  }

  // Função global de copiar
  window.copyFnScript = function(id) {
    const txt = _scriptStore[id] || '';
    navigator.clipboard.writeText(txt).then(() => {
      const btn = document.getElementById('fn-copy-' + id);
      if (btn) { btn.className = 'fn-copy ok'; btn.textContent = '✓ Copiado!'; setTimeout(() => { btn.className = 'fn-copy'; btn.textContent = '⎘ Copiar script'; }, 2000); }
    }).catch(() => {});
  };
  window._fnScripts = _scriptStore;

  // Renderizar
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'iflow';
  if (agent) {
    const banner = document.createElement('div');
    banner.style.cssText = 'display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px';
    banner.innerHTML = `<span style="font-size:22px">${agent.emoji}</span>
      <div><div style="font-size:13.5px;font-weight:700;color:var(--text)">${agent.product} · ${agent.agent}</div>
      <div style="font-size:11.5px;color:var(--text-3);margin-top:2px">Cross-sells: <b>${agent.cs.join(' · ')}</b></div></div>
      <button onclick="resetAgent()" style="margin-left:auto;font-size:10.5px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;cursor:pointer;color:var(--text-3);font-family:inherit">✏️ Trocar</button>`;
    wrap.appendChild(banner);
  }
  wrap.appendChild(renderNode(tree, 0));
  const endEl = document.createElement('div');
  endEl.style.cssText = 'text-align:center;margin-top:16px';
  endEl.innerHTML = '<div class="fn-end">✓ TICKET FECHADO</div>';
  wrap.appendChild(endEl);
  container.appendChild(wrap);
}

let _openFiScript=null;
function toggleFiScript(key,s,card,agent){
  // Fechar o anterior
  const prev=document.getElementById('fi-expanded');
  if(prev) prev.remove();
  if(_openFiScript===key){_openFiScript=null;card.classList.remove('open');return;}
  _openFiScript=key;
  // Marcar ativo
  document.querySelectorAll('.fi-script-card').forEach(c=>c.classList.remove('open'));
  card.classList.add('open');
  // Construir expanded
  const raw=s.script;
  const applied=agent?applyAgentToScript(raw,agent):raw;
  const div=document.createElement('div');div.id='fi-expanded';div.className='fi-script-expanded';
  div.innerHTML=`${s.subj?`<div class="fi-se-subj">📩 ${agent?applyAgentToScript(s.subj,agent):s.subj}</div>`:'<div style="font-size:10.5px;color:var(--text-4);margin-bottom:6px">📋 Script interno</div>'}
    <div class="fi-se-why">${s.why}</div>
    <div class="fi-se-script">${applied.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>
    <button class="fi-se-copy" id="fi-copy-${key}" onclick="copyFiScript('${key}')">⎘ Copiar</button>`;
  card.after(div);
  // Guardar para copy
  window._fiScripts=window._fiScripts||{};
  window._fiScripts[key]=applied;
}
window.copyFiScript=function(key){
  const txt=(window._fiScripts&&window._fiScripts[key])||'';
  navigator.clipboard.writeText(txt).then(()=>{
    const btn=document.getElementById('fi-copy-'+key);
    if(btn){btn.className='fi-se-copy ok';btn.textContent='✓ Copiado!';setTimeout(()=>{btn.className='fi-se-copy';btn.textContent='⎘ Copiar';},2000);}
  }).catch(()=>{});
};

function makeDraggable(el){
  let d=false,sx=0,sy=0,ox=0,oy=0;
  el.addEventListener('mousedown',e=>{d=true;sx=e.clientX;sy=e.clientY;ox=el.scrollLeft;oy=el.scrollTop;el.style.cursor='grabbing';});
  el.addEventListener('mousemove',e=>{if(!d)return;el.scrollLeft=ox-(e.clientX-sx);el.scrollTop=oy-(e.clientY-sy);});
  ['mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,()=>{d=false;el.style.cursor='grab';}));
}

    `<button class="nb${view==='fresh'?' active':''}" onclick="gFresh()" style="${view==='fresh'?'border-left-color:#0e7490;background:#0f172a':''}">
      <div class="nb-icon" style="background:${view==='fresh'?'#0e7490':'rgba(14,116,144,.15)'}"><span style="filter:${view==='fresh'?'brightness(10)':'none'}">🎫</span></div>
      <div class="nb-info"><div class="nb-name" style="${view==='fresh'?'color:#f1f5f9;font-weight:600':''}">Freshdesk como motor</div></div>
    </button>`;
}

/* ── PRICING ── */
function rPR(){
  const cards=PRICING.map(p=>{
    const cls="pc"+(p.ft?" ft":"");
    const lbl=p.label+(p.ft?'<span class="best-tag">BEST</span>':"");
    const ship=p.frete?'<div class="pc-ship">✓ Free shipping</div>':'<div style="font-size:12.5px;color:#94a3b8;margin-top:2px">+ shipping</div>';
    return `<div class="${cls}"><div class="pc-lbl">${lbl}</div><div class="pc-price">$${p.price}<span class="pc-unit">/bottle</span></div><div class="pc-info">${p.bottles} bottles &bull; ${p.supply} &bull; $${p.total} total</div><div class="pc-save">Save $${p.save}</div>${ship}</div>`;
  }).join("");
  return `<div class="pricing">${cards}</div>`;
}

/* ── SCRIPT CARD (EN + PT) ── */
const _scripts={};
function sCard(m,i,k,acc){
  const key=k+"-"+i;
  const subj=m.subj||"";
  const full=(subj?("Subject: "+subj+"\n\n"):"")+m.t;
  _scripts[key]=full;
  const ok=cpK===key;
  const btnCls="cp-btn"+(ok?" ok":"");
  const btnTxt=ok?"✓ Copiado":"📋 Copiar";
  const numHtml = (i!==null)?`<div class="sk-num" style="background:${acc}">${i+1}</div>`:'';
  return `<div class="sk">
    <div class="sk-hd">
      <div style="display:flex;align-items:center;flex:1">${numHtml}<div class="sk-lbl">${esc(m.l)}</div></div>
      <button class="${btnCls}" onclick="cpS('${key}')">${btnTxt}</button>
    </div>
    ${subj?`<div class="email-subject">📩 Subject: ${esc(subj)}</div>`:''}
    <div class="script-en">${esc(m.t)}</div>
    <div class="script-why"><span class="why-tag">Por que funciona</span><br>${m.why}</div>
  </div>`;
}

/* ── DOTS (potencial/esforço) ── */
function dots(val,col){let h="";for(let i=1;i<=5;i++)h+=`<div class="dot" style="background:${i<=val?col:'#e2e8f0'}"></div>`;return h;}

/* ── RENDER NICHE ── */
function renderNiche(){
  const n=N.find(x=>x.id===cN);
  const rdy=n.prods.filter(p=>p.r).length;
  const prods=`<div class="prod-row">${n.prods.map(p=>`<span class="pb ${p.r?'r':'w'}" style="${p.r?'background:'+n.acc:''}">${p.n}${p.r?'':' 🔄'}</span>`).join("")}</div>`;
  const tabs=`<div class="tab-nav">${TABS.map(t=>{const a=cT===t.id;return `<button class="tb${a?' active':''}" onclick="gT('${t.id}')" style="${a?'background:'+n.acc:''}">${t.lbl}</button>`;}).join("")}</div>`;

  let body="";
  if(cT==="ip"){
    const ip=n.sc.ip;
    body=`<div class="info-card">
      <div class="info-hd">
        <div class="info-format-tag" style="background:${rgba(n.acc,.15)};color:${n.txt}">${esc(ip.tipo)}</div>
        <div class="info-title">${esc(ip.titulo)}</div>
        <div class="info-desc">${esc(ip.desc)}</div>
      </div>
      <div class="info-body">
        <div class="info-meta">
          <div class="im-item"><div class="im-lbl">Preço sugerido</div><div class="im-val">${esc(ip.preco)}</div></div>
          <div class="im-item"><div class="im-lbl">Formato</div><div class="im-val">${esc(ip.tipo)}</div></div>
          <div class="im-item"><div class="im-lbl">Estratégia de uso</div><div class="im-val">${esc(ip.upsell)}</div></div>
        </div>
        <div class="info-content">
          <div class="info-content-title">Conteúdo sugerido (EN)</div>
          <div class="info-content-list">${esc(ip.conteudo)}</div>
        </div>
        <div class="slbl">Script de pitch do infoproduto</div>
        ${sCard(ip.pitch,null,"ip-"+n.id,n.acc)}
      </div></div>`;
  } else {
    const sc=n.sc[cT];
    const csCards=n.cs.map(c=>{
      const t=N.find(x=>x.id===c.nid);
      const tb=t?t.bg:"#f1f5f9", tt=t?t.txt:"#334155";
      const onclick=t?`gN('${c.nid}')`:"";
      const style=t?"":"cursor:default";
      return `<div class="cs-card" onclick="${onclick}" style="${style}"><div class="cs-name">${esc(c.n)}</div><span class="cs-nbadge" style="background:${tb};color:${tt}">${c.nid.toUpperCase()}</span><div class="cs-why">${esc(c.w)}</div></div>`;
    }).join("");
    body=`<div class="scenario-box">
        <div class="sc-title">Contexto do atendimento</div>
        <div class="sc-ctx">${esc(sc.ctx)}</div>
        <div class="sc-approach" style="background:${rgba(n.acc,.1)};color:${n.txt}">→ Abordagem: ${esc(sc.ap)}</div>
      </div>
      <div class="slbl">Scripts de e-mail (inglês) + por que funciona (PT-BR)</div>
      ${sc.msgs.map((m,i)=>sCard(m,i,cT+"-"+n.id,n.acc)).join("")}
      <div class="slbl">Cross-sells recomendados para este nicho</div>
      <div class="cs-grid">${csCards}</div>`;
  }

  const metaS=rdy!==1?"s":"";
  const header=`<div class="nh">
    <div class="nh-icon" style="background:${rgba(n.acc,.15)}">${n.icon}</div>
    <div><div><span class="nh-name">${n.label}</span><span class="nh-badge" style="background:${rgba(n.acc,.15)};color:${n.txt}">${n.abbr}</span></div>
    <div class="nh-meta">${rdy} produto${metaS} ativo${metaS} &bull; ${n.prods.length-rdy} em desenvolvimento</div></div></div>`;

  document.getElementById("content").innerHTML=header+prods+rPR()+tabs+body;
}

/* ── RENDER STRATEGY ── */
function renderStrategy(){
  const s=STRATEGIES.find(x=>x.id===cS);
  const tc=tagMap[s.tc];
  const isNew = s.id>=9;
  const header=`<div class="nh">
    <div class="nh-icon" style="background:rgba(51,65,85,.1)"><span style="font-size:27px">${s.icon}</span></div>
    <div><div><span class="nh-name">${s.name}</span><span class="nh-badge" style="background:${tc.bg};color:${tc.txt}">${s.tag}</span>${isNew?'<span class="seq-tag">ATUALIZAÇÃO 2026</span>':''}</div>
    <div class="nh-meta">Estratégia para e-mail &bull; aplica-se a todos os nichos</div></div></div>`;

  const metrics=`<div class="metric-row">
    <div class="metric-card"><div class="metric-lbl">Potencial de receita</div><div class="dots">${dots(s.potential,"#1D9E75")}</div></div>
    <div class="metric-card"><div class="metric-lbl">Esforço de setup</div><div class="dots">${dots(s.effort,"#BA7517")}</div></div>
    <div class="metric-card"><div class="metric-lbl">Gatilho</div><div style="font-size:14px;font-weight:600;color:#0f172a;line-height:1.4">${esc(s.trigger)}</div></div>
  </div>`;

  const body=`<div class="scenario-box"><div style="font-size:15.5px;color:#475569;line-height:1.75">${esc(s.desc)}</div></div>
    <div class="slbl">Scripts de e-mail (inglês) + por que funciona (PT-BR)</div>
    ${s.msgs.map((m,i)=>sCard(m,i,"strat-"+s.id,"#334155")).join("")}
    <div class="callout callout-tip"><b>💡 Dica tática:</b> ${esc(s.tip)}</div>`;

  document.getElementById("content").innerHTML=header+metrics+body;
}

/* ── MAIN ── */
function rM(){
  if(view==="intro") document.getElementById("content").innerHTML=INTRO_HTML;
  else if(view==="fresh") document.getElementById("content").innerHTML=FRESH_HTML;
  else if(view==="fluxo") renderFluxo();
  else if(view==="strategy") renderStrategy();
  else renderNiche();
  document.getElementById("main").scrollTop=0;
}

/* ── NAV ── */
window.gIntro=function(){view="intro";document.body.classList.remove('mode-fluxo');rSB();rM();};
window.gFresh=function(){view="fresh";document.body.classList.remove('mode-fluxo');rSB();rM();};
window.gFluxo=function(){view="fluxo";_fTab=0;document.body.classList.add('mode-fluxo');rSB();rM();};
window.gN=function(id){view="niche";cN=id;cT="fr";document.body.classList.remove('mode-fluxo');rSB();rM();};
window.gT=function(id){cT=id;rM();};
window.gS=function(id){view="strategy";cS=id;document.body.classList.remove('mode-fluxo');rSB();rM();};
window.cpS=function(key){
  const t=_scripts[key]||"";
  try{navigator.clipboard.writeText(t);}catch(e){}
  cpK=key;rM();setTimeout(()=>{cpK=null;rM();},2000);
};

/* ── TEMA (dark / white) ── */
let theme="white";
function setTheme(t){
  theme=t;
  if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  document.getElementById("tt-white").classList.toggle("on",t==="white");
  document.getElementById("tt-dark").classList.toggle("on",t==="dark");
}
window.setTheme=setTheme;

setTheme("white");
rSB();rM();
</script>
</body>
</html>
